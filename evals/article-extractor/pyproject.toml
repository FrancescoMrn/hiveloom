[project]
name = "article-extractor-evals"
version = "0.1.0"
description = "Benchmark: small model + hiveloom harness vs big model raw, on the article-extractor task"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.5",
    "inspect-ai>=0.3.232,<0.4",
    "jsonschema>=4",
    "openai>=1",
    "pyyaml>=6",
    "python-dotenv>=1",
    "scipy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["inspect_evals"]
