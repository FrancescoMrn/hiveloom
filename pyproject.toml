[project]
name = "hiveloom"
# Read from hiveloom.__version__, which `hiveloom package` stamps into every
# harness lock. Two hand-maintained copies of one number drift, and the way
# that failure shows up is a wheel published under a version it is not.
dynamic = ["version"]
description = "Generate, run, and evolve agent harnesses on the fly so small models reliably perform company tasks."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "hiveloom contributors" }]
keywords = ["agents", "llm", "harness", "evolution", "mcp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.27.0",
    "rich>=13.0",
    "anthropic>=0.120.1",
    "anyio>=4.0",
    "httpx2>=2.9",
    "mcp>=2.0.0",
    "python-dotenv>=1.0",
    "jsonschema>=4.0",
    "starlette>=1.0",
    "uvicorn>=0.30",
    "pyjwt[crypto]>=2.8",
    "cryptography>=42.0",
]

# Rendered as the sidebar links on the PyPI project page. Without these the
# published package points nowhere, since the long description is the README.
[project.urls]
Homepage = "https://github.com/FrancescoMrn/hiveloom"
Repository = "https://github.com/FrancescoMrn/hiveloom"
Documentation = "https://github.com/FrancescoMrn/hiveloom/blob/main/README.md"
Changelog = "https://github.com/FrancescoMrn/hiveloom/blob/main/CHANGELOG.md"
Issues = "https://github.com/FrancescoMrn/hiveloom/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=7.0", "ruff>=0.16.0"]

[project.scripts]
hiveloom = "hiveloom.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/hiveloom/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/hiveloom"]

# The agent guidance ships with the runtime so `hiveloom guide` works from a
# plain `pip install`, with no repository checkout. The repo-root files stay the
# single source of truth — the build copies them in, it does not duplicate them.
[tool.hatch.build.targets.wheel.force-include]
"AGENTS.md" = "hiveloom/agent_docs/AGENTS.md"
"SKILL.md" = "hiveloom/agent_docs/SKILL.md"
"skills" = "hiveloom/agent_docs/skills"
"docs/task-confinement.md" = "hiveloom/agent_docs/docs/task-confinement.md"
"docs/spec.md" = "hiveloom/agent_docs/docs/spec.md"
"docs/architecture.md" = "hiveloom/agent_docs/docs/architecture.md"
"docs/models.md" = "hiveloom/agent_docs/docs/models.md"
"docs/extending.md" = "hiveloom/agent_docs/docs/extending.md"
"docs/evaluating.md" = "hiveloom/agent_docs/docs/evaluating.md"
"docs/journal.md" = "hiveloom/agent_docs/docs/journal.md"
"docs/workbench.md" = "hiveloom/agent_docs/docs/workbench.md"
"docs/deploying-and-evolving.md" = "hiveloom/agent_docs/docs/deploying-and-evolving.md"
"docs/control-plane.md" = "hiveloom/agent_docs/docs/control-plane.md"
"docs/sync-protocol.md" = "hiveloom/agent_docs/docs/sync-protocol.md"

# The sdist carries the library, the example harnesses, and the agent
# guidance — nothing else. The wheel deliberately ships only the library and
# guidance: the example harnesses are repository/sdist material, not an
# importable surface. Development material — tests, docs, evals, CI config —
# stays in the repository.
[tool.hatch.build.targets.sdist]
only-include = [
    "src/hiveloom",
    "harnesses",
    "skills",
    "AGENTS.md",
    "SKILL.md",
    "docs/task-confinement.md",
    "docs/spec.md",
    "docs/architecture.md",
    "docs/models.md",
    "docs/extending.md",
    "docs/evaluating.md",
    "docs/journal.md",
    "docs/workbench.md",
    "docs/deploying-and-evolving.md",
    "docs/control-plane.md",
    "docs/sync-protocol.md",
    "README.md",
    "LICENSE",
]
exclude = [
    "**/.env",
    "**/.hiveloom",
    "**/__pycache__",
    "**/*.py[co]",
    "harnesses/**/.dockerignore",
    "harnesses/**/Dockerfile",
    "harnesses/**/hiveloom.lock",
    "harnesses/**/runtime",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # typer uses function calls in argument defaults

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["hiveloom"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
