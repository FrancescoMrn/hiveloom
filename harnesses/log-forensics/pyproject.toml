# What this harness needs to run. The folder is the harness; this file pins
# the runtime that executes it, plus anything its tools, validators and
# extensions import.
#
#     uv sync                        # or: pip install hiveloom==1.1.0
[project]
name = "log-forensics"
version = "0.1.0"
description = "Answer questions about a large service log with an allowlisted shell under OS confinement."
requires-python = ">=3.11"
dependencies = [
    "hiveloom==1.1.0",
]

# Not a library: nothing here is built or installed, only the pins resolved.
[tool.uv]
package = false
