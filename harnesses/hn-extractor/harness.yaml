version: '0.1.0'
name: hn-extractor
description: Fetch the Hacker News front page and extract the top stories into structured JSON.
model:
  provider: claude
  id: claude-haiku-4-5
  max_tokens: 4096
  temperature: 0.0
system_prompt: |
  You extract the top stories from the Hacker News front page.

  ## CRITICAL: YOUR FINAL MESSAGE MUST BE A NON-EMPTY JSON OBJECT
  You MUST output exactly one JSON object as your final message — nothing else.
  Never output an empty message. If in doubt, output the fallback JSON.

  ## STEP-BY-STEP PROCEDURE

  1. FETCH: Call http_get with url "https://news.ycombinator.com/" RIGHT NOW, before doing anything else.
     - If the tool returns an error or empty body, output exactly:
       {"source": "https://news.ycombinator.com/", "fetched_stories": 0, "stories": []}
       and stop.
     - Do NOT proceed to step 2 until you have received a non-empty HTML response.

  2. PARSE: From the raw HTML you just received, locate <tr class="athing"> elements.
     - The title and URL are inside the child element with class "titleline" (an <a> tag).
     - The immediately following <tr> (subtext row) contains score ("N points") and comment count ("N comments").
     - For internal HN links, use the full URL: https://news.ycombinator.com/item?id=XXXXX
     - If points or comments are absent (e.g. job posts), use null.
     - Extract at most 10 stories.

  3. VERIFY TITLES: For every title you intend to output, confirm it is a VERBATIM substring of the HTML you received in step 1.
     - If a title does NOT appear verbatim in that HTML, DISCARD it entirely.
     - NEVER invent, paraphrase, recall from memory, or guess titles.
     - If fewer than 10 verified titles exist, output only the verified ones.

  4. BUILD JSON: Construct the output object:
     {"source": "https://news.ycombinator.com/", "fetched_stories": <int>, "stories": [{"rank": 1, "title": "...", "url": "...", "points": 123, "comments": 45}, ...]}

  ## MANDATORY PRE-OUTPUT CHECKLIST
  Before sending your final message, answer each question:
  - Did I call http_get and receive HTML in this session? (If NO — call it now, do not output anything yet.)
  - Is every title a verbatim substring of that HTML? (If NO — remove the offending titles.)
  - Does my output start with '{' and end with '}' with zero surrounding characters? (If NO — fix it.)
  - Is my output valid JSON with no markdown fences, backticks, prose, or code blocks? (If NO — fix it.)
  - Is my output non-empty? (If it would be empty or blank — output the fallback JSON instead.)

  ## OUTPUT RULES (STRICT)
  - Your final message MUST be a single raw JSON object and absolutely nothing else.
  - Do NOT include prose, explanations, markdown fences (```), code blocks, or backticks.
  - Do NOT output an empty message. An empty message is always wrong.
  - Start with '{' and end with '}' — no whitespace or characters outside the JSON object.
  - If you have no verified stories, output: {"source": "https://news.ycombinator.com/", "fetched_stories": 0, "stories": []}
  - If you are unsure what to output, output the fallback JSON above rather than nothing.
tools:
- builtin: http_get
hooks:
- builtin: strip_json_fence
  event: before_verification
context:
  max_input_tokens: 30000
  strategy: full
  compaction:
    trigger_at_pct: 80
    method: summarize
  pinned:
  - system_prompt
  - task_statement
guardrails:
- builtin: max_wall_clock_seconds
  value: 120
- builtin: no_network_write
- builtin: max_cost_usd
  value: 1.0
- builtin: max_cost_usd
  value: 0.25
loop:
  policy: react
  max_turns: 20
  on_tool_error: retry_once
  require_verification: true
verify:
  validators:
  - builtin: output_schema
    schema_file: ./schemas/output.json
  - builtin: regex_match
    pattern: '"stories"'
  - code: validators/titles_on_page.py:validate
    description: Every extracted title must appear on the live HN front page (anti-hallucination).
  on_fail:
    action: retry_with_feedback
    max_retries: 2
logging:
  trace_dir: ./.hiveloom/traces
  level: full
  redact:
  - api[_-]?key
evolution:
  enabled: true
  mutable:
  - system_prompt
  - loop.max_turns
  - loop.policy
  - context.strategy
  - tools
  frozen:
  - guardrails
  - model
