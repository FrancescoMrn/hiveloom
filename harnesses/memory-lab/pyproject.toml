# What this harness needs to run. The folder is the harness; this file pins
# the runtime that executes it, plus anything its tools, validators and
# extensions import.
#
#     uv sync                        # or: pip install hiveloom==1.2.0
[project]
name = "memory-lab"
version = "0.1.0"
description = "Answer three questions about a large service log using run-scoped notes, in-place transforms of the spilled log, and durable memory."
requires-python = ">=3.11"
dependencies = [
    "hiveloom==1.2.0",
]

# Not a library: nothing here is built or installed, only the pins resolved.
[tool.uv]
package = false
