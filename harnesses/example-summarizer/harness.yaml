schema_version: 0.2.0
name: example-summarizer
id: hl-10ce3d23a187
description: Summarize a text file into a structured JSON summary.
model:
  provider: claude
  id: claude-haiku-4-5
  max_tokens: 4096
  temperature: 0.0
system_prompt: |
  You summarize a source text into one compact, structured JSON object.

  The task input is the source itself: either the text to summarize, or the name of a file in the working directory. If the input is a short string that looks like a filename (for example `notes.txt`), read that file with the `file_read` tool and summarize its contents; otherwise summarize the input text directly — do not go looking for a file that was never named.

  Before you write, load the `house-style` skill with `load_skill` and follow it: the
  validators check it.

  Emit exactly one JSON object with these keys:

    "title"       a short title for the source
    "summary"     a condensed prose summary, shorter than the source — aim for 20-30% of the original length
    "key_points"  an array of the claims the source actually makes

  CRITICAL OUTPUT RULES:
  - Your entire response must be ONLY the raw JSON object — no prose before or after, no markdown fences, no backticks, no ```json``` blocks, no explanation.
  - Start your response with '{' and end it with '}'. Nothing else.
  - The "summary" value MUST be significantly shorter than the source text. Do not restate the full source; condense it.
  - Summarize only what the source says. Do not add claims it does not make, and do not editorialise.
  - If verification comes back with feedback, fix exactly what the feedback names and re-emit the whole JSON object (and only the JSON object).
tools:
- builtin: file_read
- builtin: file_write
- builtin: load_skill
mcp_servers: []
skills:
- house-style
playbooks: []
context:
  max_input_tokens: 30000
  strategy: rolling
  compaction:
    trigger_at_pct: 80
    method: summarize
  pinned:
  - system_prompt
  - task_statement
  tool_results:
    max_inline_bytes: 16384
    preview_head_bytes: 2048
    preview_tail_bytes: 1024
    transforms: true
guardrails:
- builtin: max_cost_usd
  value: 0.25
- builtin: max_wall_clock_seconds
  value: 120
- builtin: tool_allowlist
loop:
  policy: react
  steps: []
  max_turns: 16
  on_tool_error: retry_once
  tool_execution: sequential
  require_verification: true
verify:
  validators:
  - builtin: output_schema
    schema_file: ./schemas/output.json
  - code: validators/check_summary.py:validate
    description: The summary must carry content and be shorter than the source.
  on_fail:
    action: retry_with_feedback
    max_retries: 2
logging:
  trace_dir: ./.hiveloom/traces
  level: journal
  redact:
  - api[_-]?key
  snapshot_files: false
confinement:
  mode: auto
  network: false
  writable: true
  hide_home: true
  env_passthrough: []
  timeout_seconds: 30
  max_output_bytes: 1048576
  max_memory_mb: 2048
  max_processes: 0
egress:
  mode: redact
  detect_credentials: true
  patterns: []
delegation:
  enabled: false
  directory: local
  when:
  - model_choice
  min_peer_success_rate: 0.0
  min_peer_runs: 0
  max_depth: 2
  budget_share: 0.5
  exclude: []
evolution:
  enabled: true
  mutable:
  - system_prompt
  - loop.max_turns
  - loop.policy
  - context.strategy
  - tools
  frozen:
  - guardrails
  - model
  auto_propose:
    enabled: false
    min_failures: 5
    cooldown_hours: 24.0
  reflect:
    enabled: false
    'on': failure
    max_lessons: 1
    cooldown_minutes: 30.0
