# What this harness needs to run. The folder is the harness; this file pins
# the runtime that executes it, plus anything its tools, validators and
# extensions import.
#
#     uv sync                        # or: pip install hiveloom==1.0.0
[project]
name = "routing-lab"
version = "0.1.0"
description = "Read an incident, triage it on a cheap model, then route to a decision model and emit a verified JSON decision."
requires-python = ">=3.11"
dependencies = [
    "hiveloom==1.0.0",
]

# Not a library: nothing here is built or installed, only the pins resolved.
[tool.uv]
package = false
