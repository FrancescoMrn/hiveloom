name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Publish the built distribution to PyPI (needs a configured trusted publisher)."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag, tests, harnesses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Check tag matches project version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(uv run python -c \
            "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag v$TAG does not match pyproject.toml version $VERSION"
            exit 1
          fi
      - name: Install dev dependencies
        run: uv sync --extra dev
      - name: Run tests
        run: uv run pytest
      - name: Validate example harnesses
        # Trust-gated like the CI job; scoped to this step so pytest above still
        # runs with an unset policy.
        env:
          HIVELOOM_TRUST: always
        run: |
          for harness in harnesses/*/; do
            uv run hiveloom validate "$harness"
          done

  build:
    name: Build distribution
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build sdist and wheel
        run: uv build
      - name: Check distribution metadata
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Publishing is a DELIBERATE, MANUAL action, never automatic on a tag push:
    # run this workflow via "Run workflow" (workflow_dispatch) with
    # `publish_pypi=true`. A plain `v*` tag builds and cuts a GitHub Release but
    # does not publish, so tagging for history never risks an unintended upload.
    # Requires a PyPI "trusted publisher" configured for this repo/workflow and
    # the GitHub environment named "pypi" below (add required reviewers there to
    # gate publishing further).
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_pypi }}
    environment:
      name: pypi
      url: https://pypi.org/p/hiveloom
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Extract the CHANGELOG section for this version
        # The release body should be the curated changelog entry, not a commit
        # list. Falls back to generated notes when the section is missing (a
        # tag with no CHANGELOG entry, or a workflow_dispatch run).
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "notes=file" >> "$GITHUB_ENV"
          else
            echo "::warning::no CHANGELOG section for $VERSION; using generated notes"
            echo "notes=generate" >> "$GITHUB_ENV"
          fi
      - name: Create release with artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Idempotent so a re-run of the tag workflow refreshes the assets
        # instead of failing on "release already exists". A re-run never
        # rewrites the body, so notes edited by hand on the release page
        # survive.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          elif [ "$notes" = "file" ]; then
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
