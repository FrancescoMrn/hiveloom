name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Check lockfile is up to date
        run: uv lock --check
      - name: Install dev dependencies
        run: uv sync --extra dev
      - name: Ruff
        run: uv run ruff check .
      - name: Check the version wiring still resolves
        # There is one version now, `hiveloom.__version__`, and hatchling reads
        # it from there. What can still break silently is the wiring: a static
        # `version` added back to pyproject.toml, or `[tool.hatch.version].path`
        # pointed elsewhere, publishes a wheel under a version nothing else
        # agrees with. `build` below checks the artifacts actually carry it.
        run: |
          uv run python - <<'EOF'
          import re
          import sys
          import tomllib
          from pathlib import Path

          config = tomllib.loads(Path("pyproject.toml").read_text())
          if "version" in config["project"]:
              sys.exit("pyproject.toml pins a static version; it must stay dynamic")
          if "version" not in config["project"].get("dynamic", []):
              sys.exit("pyproject.toml no longer declares version as dynamic")
          path = config["tool"]["hatch"]["version"]["path"]
          if path != "src/hiveloom/__init__.py":
              sys.exit(f"[tool.hatch.version].path is {path}, not src/hiveloom/__init__.py")
          match = re.search(r'^__version__ = "([^"]+)"$', Path(path).read_text(), re.M)
          if match is None:
              sys.exit(f"no top-level __version__ assignment in {path}")
          print(f"version {match.group(1)} resolves from {path}")
          EOF

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dev dependencies
        run: uv sync --extra dev
      - name: Install a sandbox backend, if the runner can have one
        # Without bwrap the confinement tests marked `sandboxed` skip, and this
        # release's kernel-enforced isolation goes untested here. This step
        # cannot fail the job: if the runner will not give us a working bwrap,
        # `available_backend()` reports none and those tests skip as before.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap || true
      # No ANTHROPIC_API_KEY on purpose: tests must pass offline with fake
      # providers (CONTRIBUTING.md contract).
      - name: Run tests with branch coverage
        run: uv run pytest --cov --cov-report=term-missing

  harnesses:
    name: Validate example harnesses
    runs-on: ubuntu-latest
    # validate/run resolve code hooks, so both are trust-gated; with no TTY the
    # prompt aborts (exit 4). These harnesses are this repo's own checkout, so
    # the documented CI policy applies.
    env:
      HIVELOOM_TRUST: always
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install project
        run: uv sync --extra dev
      - name: Validate every harness in harnesses/
        run: |
          for harness in harnesses/*/; do
            uv run hiveloom validate "$harness"
          done
      - name: Dry-run the example summarizer
        run: >
          uv run hiveloom run harnesses/example-summarizer
          --input harnesses/example-summarizer/notes.txt --dry-run

  workbench:
    name: Workbench (frontend + distribution)
    runs-on: ubuntu-latest
    # The workbench's Python side is already covered by tests/test_devtools_ui.py
    # in the `test` job. What exists nowhere else is the frontend and the
    # packaging around it: a TypeScript error, a failing UI test, or a wheel that
    # installs but carries no bundle would otherwise merge green and only surface
    # at release. This runs the same script the release workflow runs, so the two
    # cannot drift apart.
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: devtools/ui/package-lock.json
      - name: Install project
        run: uv sync --extra dev
      - name: Validate the bundled copilot harness
        # It ships inside the workbench wheel, so it is release material rather
        # than a test fixture, and has to stay loadable.
        env:
          HIVELOOM_TRUST: always
        run: uv run hiveloom validate devtools/ui/copilot --json
      - name: Typecheck, test, build, and install the workbench
        # --check installs the packed tarball and launches it, confirming it
        # serves the interface and reaches its own Python API. It is the only
        # step that catches a package which is valid but empty, or one that
        # ships `vite.config.ts` and so mistakes itself for a checkout.
        run: scripts/build_workbench.sh --check

  build:
    name: Build & install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build sdist and wheel
        run: uv build
      - name: Check the built distribution carries hiveloom.__version__
        # The one thing the wiring check in `lint` cannot see: whether hatchling
        # actually stamped that version onto the artifacts we would publish.
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/hiveloom/__init__.py)
          if [ -z "$VERSION" ]; then
            echo "::error::no __version__ in src/hiveloom/__init__.py"
            exit 1
          fi
          for artifact in "dist/hiveloom-$VERSION.tar.gz" \
                          "dist/hiveloom-$VERSION-py3-none-any.whl"; do
            if [ ! -f "$artifact" ]; then
              echo "::error::missing $artifact; dist holds: $(ls dist)"
              exit 1
            fi
          done
          echo "built hiveloom $VERSION"
      - name: Check distribution metadata
        run: uvx twine check dist/*
      - name: Smoke-test the wheel in a clean environment
        run: |
          WHEEL=$(ls dist/*.whl)
          uv run --isolated --no-project --with "$WHEEL" -- hiveloom --help
          uv run --isolated --no-project --with "$WHEEL" -- python -c \
            "import hiveloom; print('imported hiveloom', hiveloom.__version__)"
      - name: Ensure no secrets or traces leaked into the sdist
        run: |
          SDIST=$(ls dist/*.tar.gz)
          # .env.example templates are the one intentional exception.
          if tar -tzf "$SDIST" \
            | grep -E '(^|/)\.env|(^|/)\.token\.|(^|/)(traces|__pycache__)/|\.py[co]$' \
            | grep -v '\.env\.example$'; then
            echo "::error::sdist contains secrets, traces, or interpreter caches"
            exit 1
          fi
          echo "sdist clean"
      - name: Ensure generated harness artifacts stay out of the sdist
        run: |
          SDIST=$(ls dist/*.tar.gz)
          if tar -tzf "$SDIST" | sed 's|^[^/]*/||' \
            | grep -E '^harnesses/[^/]+/(Dockerfile|\.dockerignore|hiveloom\.lock|runtime/)'; then
            echo "::error::sdist contains generated harness deployment artifacts"
            exit 1
          fi
          echo "generated harness artifacts excluded"
      - name: Ensure the sdist ships only runtime, harnesses, and agent guidance
        # Development material (tests, evals, CI config) stays in the repository
        # — see [tool.hatch.build.targets.sdist]. The reference documents under
        # docs/ are the one exception: `uv build` builds the wheel *from* the
        # sdist, and the wheel force-includes them as `hiveloom guide` topics, so
        # they have to travel in it. Anything else under docs/ — drafts,
        # proposals, images — must not, so the shipped set is compared against
        # the force-include list rather than waved through by prefix.
        run: |
          SDIST=$(ls dist/*.tar.gz)
          python3 - "$SDIST" <<'EOF'
          import sys
          import tarfile
          import tomllib
          from pathlib import Path

          wheel = tomllib.loads(Path("pyproject.toml").read_text())
          force_include = wheel["tool"]["hatch"]["build"]["targets"]["wheel"]["force-include"]
          guide_docs = {name for name in force_include if name.startswith("docs/")}

          with tarfile.open(sys.argv[1]) as archive:
              shipped = [n.split("/", 1)[1] for n in archive.getnames() if "/" in n]

          offenders = sorted(
              name
              for name in shipped
              if name.startswith(("tests/", "evals/", ".github/", ".claude/"))
              or (name.startswith("docs/") and name not in guide_docs)
          )
          for name in offenders:
              print(f"::error::sdist ships {name}, which is repository-only material")
          if offenders:
              sys.exit("sdist scope violated")
          print(f"sdist scope clean ({len(guide_docs)} guide documents)")
          EOF
      - name: Ensure the agent guidance is packaged in the wheel
        run: |
          WHEEL=$(ls dist/*.whl)
          # `hiveloom guide` must work from a plain install, with no checkout.
          for doc in hiveloom/agent_docs/AGENTS.md hiveloom/agent_docs/SKILL.md; do
            unzip -l "$WHEEL" | grep -q "$doc" || {
              echo "::error::$doc missing from the wheel"; exit 1; }
          done
          TOPICS=$(uv run --isolated --no-project --with "$WHEEL" -- hiveloom guide --list --json)
          for topic in agents all build run evolve extend ship; do
            echo "$TOPICS" | grep -q "\"name\": \"$topic\"" || {
              echo "::error::guide topic '$topic' missing from the installed wheel"; exit 1; }
          done
          echo "guide ships every topic"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
